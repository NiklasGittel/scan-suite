services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: scansuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: scansuite
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scansuite"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"   # dev only; bound to localhost

volumes:
  pgdata: